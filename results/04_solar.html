<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEMS — 太陽能與儲能系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* 基礎樣式 */
:root{ --bg:#050506; --bg-2:#0a0a0b; --card:#121214; --line:rgba(255,255,255,0.09); --line-soft:rgba(255,255,255,0.05); --white:#f3f2ee; --dim:#8a8a90; --faint:#4d4d52; --accent:#c8ff4d; --accent-dim:rgba(200,255,77,0.10); --accent-line:rgba(200,255,77,0.35); --off:#ff5a5a; --solar:#FFD700; }
*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--white); font-family:'Inter','Noto Sans TC',sans-serif; overflow-x:hidden; }
.topbar{ position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:26px 5vw; transition:all .4s ease; border-bottom:1px solid transparent; }
.topbar.scrolled{ background:rgba(5,5,6,0.82); backdrop-filter:blur(14px); padding:16px 5vw; border-bottom:1px solid var(--line); }
.brand{display:flex; align-items:center; gap:11px; cursor:pointer;}
.brand .ring{ width:22px; height:22px; border-radius:50%; border:2px solid var(--accent); position:relative; }
.brand .ring::after{content:'';position:absolute; inset:5px; border-radius:50%; background:var(--accent); opacity:.9;}
.brand span{font-family:'Bebas Neue'; font-size:20px; letter-spacing:2px;}
.crumb{color:var(--dim); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; font-family:'Space Mono',monospace;}
.crumb b{color:var(--accent); font-weight:400;}
.section{max-width:1360px; margin:0 auto; padding:150px 5vw;}
.section.tight{padding-top:80px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:2px; padding:30px;}
.spec-label{font-family:'Space Mono'; font-size:10.5px; letter-spacing:2px; color:var(--faint); text-transform:uppercase; margin-bottom:8px;}
.chart-label{font-family:'Space Mono'; font-size:10.5px; letter-spacing:2px; color:var(--faint); text-transform:uppercase; margin:0 0 18px;}
.badge{font-family:'Space Mono'; font-size:11px; letter-spacing:1px; padding:5px 12px; border:1px solid; text-transform:uppercase;}
.badge-on{color:var(--accent); border-color:var(--accent-line); background:var(--accent-dim);}
.btn-line{ all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:10px; font-family:'Space Mono'; font-size:11.5px; letter-spacing:2px; text-transform:uppercase; color:var(--dim); padding-bottom:6px; border-bottom:1px solid var(--line); transition:.25s; }
.btn-line:hover{color:var(--white); border-color:var(--accent);}
.detail-hero{ min-height:56vh; display:flex; align-items:center; padding:120px 5vw 60px; background:radial-gradient(ellipse 70% 70% at 70% 40%, rgba(255,215,0,0.05), transparent 70%); border-bottom:1px solid var(--line); }
.detail-hero-inner{display:grid; grid-template-columns:1fr 1.4fr; gap:60px; align-items:center; width:100%; max-width:1360px; margin:0 auto;}
.detail-title-block h1{font-family:'Bebas Neue'; font-size:clamp(48px,7vw,110px); margin:0; line-height:0.9;}
footer{border-top:1px solid var(--line); padding:44px 5vw; color:var(--faint); font-size:11.5px; text-align:center; font-family:'Space Mono';}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="brand" onclick="window.location.href='hems_index.html'">
    <div class="ring"></div>
    <span>HEMS</span>
  </div>
  <div class="nav-right">
    <div class="crumb">主頁 <span style="opacity:.4">/</span> <b>太陽能系統</b></div>
  </div>
</div>

<div class="detail-page active">
  <section class="detail-hero">
    <div class="detail-hero-inner">
      <div class="detail-icon" id="detailIcon">
        <svg width="240" height="240" viewBox="0 0 100 100" fill="none">
          <polygon points="15,35 70,20 85,35 30,50" stroke="#FFD700" stroke-width="1.5"/>
          <line x1="15" y1="35" x2="30" y2="50" stroke="#FFD700" stroke-width="1"/>
          <line x1="70" y1="20" x2="85" y2="35" stroke="#FFD700" stroke-width="1"/>
          <rect x="20" y="65" width="55" height="20" stroke="#FFD700" stroke-width="1.5"/>
          <line x1="33" y1="65" x2="33" y2="85" stroke="#FFD700" stroke-width="1"/>
          <line x1="46" y1="65" x2="46" y2="85" stroke="#FFD700" stroke-width="1"/>
          <line x1="59" y1="65" x2="59" y2="85" stroke="#FFD700" stroke-width="1"/>
        </svg>
      </div>

      <div class="detail-title-block">
        <button class="btn-line" onclick="window.location.href='hems_index.html'"><span class="arrow">←</span> BACK TO HOME</button>
        <div class="spec-label" style="margin-top:26px;">SYSTEM / SOLAR</div>
        <h1>太陽能與儲能</h1>
        <div style="margin-top:20px;"><span class="badge badge-on" style="color:var(--solar); border-color:var(--solar); background:rgba(255,215,0,0.1);">ONLINE</span></div>
      </div>
    </div>
  </section>

  <!-- === 太陽能 (PV) 區塊 === -->
  <div class="section tight">
    <div class="card" style="width: 100%;">
      <p class="chart-label">LIVE PV GENERATION TREND (kW)</p>
      <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px;">
        
        <!-- 左側：大標題 -->
        <h2 style="font-family:'Noto Sans TC'; margin:0; font-size:24px;">即時發電量曲線</h2>
        
        <!-- 右側：數值顯示區 -->
        <div style="display:flex; gap:40px; text-align:right;">
            <!-- 即時功率區塊 -->
            <div>
                <div style="font-family:'Noto Sans TC'; font-size:16px; color:var(--faint); margin-bottom:8px; font-weight:bold;">即時功率</div>
                <div style="font-family:'Bebas Neue'; font-size:42px; color:var(--solar); line-height: 1;" id="currentPowerText">
                    0.00 <span style="font-size:20px; color:var(--faint);">kW</span>
                </div>
            </div>
            <!-- 累積發電量區塊 -->
            <div>
                <div style="font-family:'Noto Sans TC'; font-size:16px; color:var(--faint); margin-bottom:8px; font-weight:bold;">總發電量</div>
                <div style="font-family:'Bebas Neue'; font-size:42px; color:var(--solar); line-height: 1;" id="cumulativePowerText">
                    0.00 <span style="font-size:20px; color:var(--faint);">kWh</span>
                </div>
            </div>
        </div>
      </div>
      <canvas id="detailChart" height="120"></canvas>
    </div>
  </div>

  <!-- === 電池儲能系統 (BESS) 區塊 === -->
  <div class="section tight" style="padding-top: 40px;">
    <div class="card" style="width: 100%;">
      <p class="chart-label" style="color:var(--faint);">BESS REAL-TIME STATUS</p>
      <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px;">
        
        <!-- 左側：標題與電池 Icon -->
        <div style="display:flex; align-items:center; gap:15px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4dffb8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="16" height="10" rx="2" ry="2"></rect>
            <line x1="22" y1="11" x2="22" y2="13"></line>
            <line x1="6" y1="12" x2="14" y2="12"></line>
            <line x1="10" y1="8" x2="10" y2="16"></line>
          </svg>
          <h2 style="font-family:'Noto Sans TC'; margin:0; font-size:24px;">儲能系統狀態</h2>
        </div>
        
        <!-- 右側：數值顯示區 -->
        <div style="display:flex; gap:40px; text-align:right;">
            <!-- 輸出電流 (A) -->
            <div>
                <div style="font-family:'Noto Sans TC'; font-size:16px; color:var(--faint); margin-bottom:8px; font-weight:bold;">輸出電流</div>
                <div style="font-family:'Bebas Neue'; font-size:42px; color:#4dffb8; line-height: 1;" id="bessAmpText">
                    0.00 <span style="font-size:20px; color:var(--faint);">A</span>
                </div>
            </div>
            <!-- 輸出功率 (kW) -->
            <div>
                <div style="font-family:'Noto Sans TC'; font-size:16px; color:var(--faint); margin-bottom:8px; font-weight:bold;">即時功率</div>
                <div style="font-family:'Bebas Neue'; font-size:42px; color:#4dffb8; line-height: 1;" id="bessPowerText">
                    0.00 <span style="font-size:20px; color:var(--faint);">kW</span>
                </div>
            </div>
            <!-- 電池電量 (SoC) -->
            <div>
                <div style="font-family:'Noto Sans TC'; font-size:16px; color:var(--faint); margin-bottom:8px; font-weight:bold;">剩餘電量 (SoC)</div>
                <div style="font-family:'Bebas Neue'; font-size:42px; color:#4dffb8; line-height: 1;" id="bessSocText">
                    0.0 <span style="font-size:20px; color:var(--faint);">%</span>
                </div>
            </div>
        </div>
      </div>
      <!-- 電池電量變化曲線圖 -->
      <canvas id="bessChart" height="120"></canvas>
    </div>
  </div>

</div>

<footer>
  HEMS PROTOTYPE — DATA SOURCED FROM API & STATIC CSV
</footer>

<script>
window.addEventListener('scroll', () => {
  document.getElementById('topbar').classList.toggle('scrolled', window.scrollY > 40);
});

// === 全域變數宣告 ===
let detailChart;
let pvCurveDB = {}; 
let solarHistory = { labels: [], data: [] }; 

let bessChart;
let bessHistory = { labels: [], data: [] }; 

// ==========================================
// 1. 初始化空圖表 (太陽能 + 儲能)
// ==========================================
function initChart() {
  // 太陽能圖表
  const ctx = document.getElementById('detailChart').getContext('2d');
  detailChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [], 
      datasets: [{
        label: '太陽能發電量 (kW)',
        data: [], 
        borderColor: '#FFD700', 
        backgroundColor: 'rgba(255, 215, 0, 0.1)', 
        fill: true,
        tension: 0.4, 
        pointRadius: 2, 
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      animation: { duration: 0 }, 
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#5a5a60', font: { family: 'Space Mono', size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { 
          suggestedMax: 10,
          ticks: { color: '#5a5a60', font: { family: 'Space Mono', size: 10 } }, 
          grid: { color: 'rgba(255,255,255,0.05)' } 
        }
      }
    }
  });

  // 電池圖表
  const ctxBess = document.getElementById('bessChart').getContext('2d');
  bessChart = new Chart(ctxBess, {
    type: 'line',
    data: {
      labels: [], 
      datasets: [{
        label: '電池電量 SoC (%)',
        data: [], 
        borderColor: '#4dffb8', 
        backgroundColor: 'rgba(77, 255, 184, 0.1)', 
        fill: true,
        tension: 0.4, 
        pointRadius: 2, 
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      animation: { duration: 0 },
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#5a5a60', font: { family: 'Space Mono', size: 10 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
        y: { 
          min: 0, max: 100, 
          ticks: { color: '#5a5a60', font: { family: 'Space Mono', size: 10 } }, 
          grid: { color: 'rgba(255,255,255,0.05)' } 
        }
      }
    }
  });
}

// ==========================================
// 2. 先行載入 CSV 劇本
// ==========================================
async function preloadSolarCSV() {
  try {
    const res = await fetch('./data/pv_curve_15min.csv?t=' + new Date().getTime());
    if (!res.ok) throw new Error('找不到 CSV 檔案');
    
    const text = await res.text();
    const records = Papa.parse(text.trim(), { header: true, dynamicTyping: true, skipEmptyLines: true }).data;

    records.forEach(row => {
      if (row.time !== undefined && row.pv_kw !== undefined && row.time !== null) {
        let rawTime = String(row.time).trim();
        let rawPv = parseFloat(row.pv_kw);
        let pvValueKw = isNaN(rawPv) ? 0 : (rawPv / 1000); // W 轉 kW

        let timeParts = rawTime.split(':');
        if (timeParts.length >= 2) {
          let h = timeParts[0].padStart(2, '0');
          let m = timeParts[1].padStart(2, '0');
          let formattedTime = `${h}:${m}`;
          pvCurveDB[formattedTime] = pvValueKw;
        }
      }
    });
    console.log("✅ 太陽能劇本載入成功！");
  } catch (error) {
    console.error("讀取太陽能 CSV 失敗：", error);
  }
}

// ==========================================
// 3. 接收後端時間並更新圖表 (每秒觸發)
// ==========================================
// ==========================================
// 3. 接收後端時間並讀取 CSV 更新圖表
// ==========================================
async function fetchLiveGridStatus() {
  try {
    // 1. 呼叫 API 推進時間
    const response = await fetch('/api/grid_status');
    const data = await response.json();

    if (data.status === 'success') {
      const timeOnly = data.timestamp.replace('模擬時間 ', '').trim();
      
      // 更新狀態列
      document.querySelector('.crumb').innerHTML = 
        `主頁 <span style="opacity:.4">/</span> <b>太陽能系統</b> <span style="color:var(--solar); margin-left:15px; font-weight:bold;">⚡ LIVE: ${timeOnly}</span>`;

      // --- 🌞 太陽能資料更新邏輯 (維持不變) ---
      let currentPVKw = pvCurveDB[timeOnly] !== undefined ? pvCurveDB[timeOnly] : 0;
      document.getElementById('currentPowerText').innerHTML = 
        `${currentPVKw.toFixed(2)} <span style="font-size:20px; color:var(--faint);">kW</span>`;

      let totalKw = 0;
      for (let timeKey in pvCurveDB) {
          if (timeKey <= timeOnly) {  
              totalKw += pvCurveDB[timeKey];
          }
      }
      let cumulativeKwh = totalKw * 0.25; 
      document.getElementById('cumulativePowerText').innerHTML = 
          `${cumulativeKwh.toFixed(2)} <span style="font-size:20px; color:var(--faint);">kWh</span>`;

      solarHistory.labels.push(timeOnly);
      solarHistory.data.push(currentPVKw);
      if (solarHistory.labels.length > 96) {
        solarHistory.labels.shift();
        solarHistory.data.shift();
      }
      detailChart.data.labels = [...solarHistory.labels];
      detailChart.data.datasets[0].data = [...solarHistory.data];
      detailChart.update();

      // --- 🔋 電池資料更新邏輯 (改為讀取 CSV) ---
      const bessRes = await fetch('/data/bess_status.csv?t=' + new Date().getTime());
      if (bessRes.ok) {
          const bessText = await bessRes.text();
          // 使用 PapaParse 解析，自動將數字字串轉為數字 (dynamicTyping: true)
          const bessRecords = Papa.parse(bessText.trim(), { header: true, dynamicTyping: true, skipEmptyLines: true }).data;
          
          if (bessRecords.length > 0) {
              const bessData = bessRecords[0]; // 讀取最新一筆 (第一列)
              
              document.getElementById('bessSocText').innerHTML = 
                  `${bessData.soc.toFixed(1)} <span style="font-size:20px; color:var(--faint);">%</span>`;
              document.getElementById('bessPowerText').innerHTML = 
                  `${bessData.power_kw.toFixed(2)} <span style="font-size:20px; color:var(--faint);">kW</span>`;
              document.getElementById('bessAmpText').innerHTML = 
                  `${bessData.current_a.toFixed(2)} <span style="font-size:20px; color:var(--faint);">A</span>`;

              // 推進電池歷史折線圖
              bessHistory.labels.push(bessData.time);
              bessHistory.data.push(bessData.soc);

              if (bessHistory.labels.length > 96) {
                  bessHistory.labels.shift();
                  bessHistory.data.shift();
              }

              bessChart.data.labels = [...bessHistory.labels];
              bessChart.data.datasets[0].data = [...bessHistory.data];
              bessChart.update();
          }
      }
    }
  } catch (error) {
    console.error("API 連線或讀取 CSV 失敗：", error);
  }
}

// ==========================================
// 🚀 網頁啟動點
// ==========================================
(async function boot(){
  initChart();
  await preloadSolarCSV(); 
  setInterval(fetchLiveGridStatus, 300); 
})();
</script>
</body>
</html>
