<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEMS — 05 電錶總覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<!-- 沿用您的套件設定 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* 完全沿用原有的 CSS 變數與核心設計 */
:root{
  --bg:#050506;
  --bg-2:#0a0a0b;
  --panel:#0f0f11;
  --card:#121214;
  --line:rgba(255,255,255,0.09);
  --line-soft:rgba(255,255,255,0.05);
  --white:#f3f2ee;
  --dim:#8a8a90;
  --faint:#4d4d52;
  --accent:#c8ff4d;
  --accent-dim:rgba(200,255,77,0.10);
  --accent-line:rgba(200,255,77,0.35);
  --off:#ff5a5a;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--bg); color:var(--white);
  font-family:'Inter','Noto Sans TC',sans-serif;
  font-weight:400; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.display{font-family:'Bebas Neue','Noto Sans TC',sans-serif; letter-spacing:0.5px;}
.mono{font-family:'Space Mono',monospace;}
.tc{font-family:'Noto Sans TC',sans-serif;}
a{color:inherit;}
::selection{background:var(--accent); color:#050506;}

/* ---------- nav ---------- */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:26px 5vw; transition:all .4s ease; border-bottom:1px solid transparent;
}
.topbar.scrolled{
  background:rgba(5,5,6,0.82); backdrop-filter:blur(14px);
  padding:16px 5vw; border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:11px; cursor:pointer;}
.brand .ring{
  width:22px; height:22px; border-radius:50%; border:2px solid var(--accent); position:relative;
}
.brand .ring::after{content:'';position:absolute; inset:5px; border-radius:50%; background:var(--accent); opacity:.9;}
.brand span{font-family:'Bebas Neue'; font-size:20px; letter-spacing:2px;}
.nav-right{display:flex; align-items:center; gap:34px;}
.crumb{color:var(--dim); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; font-family:'Space Mono',monospace;}
.crumb b{color:var(--accent); font-weight:400;}

/* ---------- section shell ---------- */
.section{max-width:1360px; margin:0 auto; padding:150px 5vw;}
.section.tight{padding-top:80px;}

.card{background:var(--card); border:1px solid var(--line); border-radius:2px; padding:30px;}
.grid-2{display:grid; grid-template-columns:1fr 1.8fr; gap:1px; background:var(--line);} /* 調整比例，圖表給寬一點 */
.grid-2 > .card{border-radius:0; border:none;}
@media(max-width:900px){.grid-2{grid-template-columns:1fr;}}

.spec-label{font-family:'Space Mono'; font-size:10.5px; letter-spacing:2px; color:var(--faint); text-transform:uppercase; margin-bottom:8px;}
canvas{max-width:100%;}
.chart-label{font-family:'Space Mono'; font-size:10.5px; letter-spacing:2px; color:var(--faint); text-transform:uppercase; margin:0 0 18px;}

.badge{font-family:'Space Mono'; font-size:11px; letter-spacing:1px; padding:5px 12px; border:1px solid; text-transform:uppercase;}
.badge-on{color:var(--accent); border-color:var(--accent-line); background:var(--accent-dim);}

/* buttons */
.btn-line{
  all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:10px;
  font-family:'Space Mono'; font-size:11.5px; letter-spacing:2px; text-transform:uppercase;
  color:var(--dim); padding-bottom:6px; border-bottom:1px solid var(--line); transition:.25s;
}
.btn-line:hover{color:var(--white); border-color:var(--accent);}
.btn-line:hover .arrow{transform:translateX(4px);}
.arrow{transition:.25s; display:inline-block;}

/* ---------- detail pages ---------- */
.detail-page{display:block;}
.detail-hero{
  min-height:45vh; display:flex; align-items:center; padding:120px 5vw 60px;
  background:radial-gradient(ellipse 70% 70% at 70% 40%, rgba(200,255,77,0.05), transparent 70%);
  border-bottom:1px solid var(--line);
}
.detail-hero-inner{display:grid; grid-template-columns:1fr 1.4fr; gap:60px; align-items:center; width:100%; max-width:1360px; margin:0 auto;}
.detail-icon{display:flex; align-items:center; justify-content:center;}
.detail-title-block .spec-label{margin-bottom:16px;}
.detail-title-block h1{font-family:'Bebas Neue'; font-size:clamp(48px,7vw,90px); margin:0; line-height:0.9;}

.spec-sheet{border-top:1px solid var(--line);}
.spec-sheet-row{
  display:flex; align-items:baseline; justify-content:space-between;
  padding:16px 0; border-bottom:1px solid var(--line-soft); /* 縮小一點 padding 以塞下 6 個 */
}
.spec-sheet-row .k{font-family:'Space Mono'; font-size:11px; letter-spacing:2px; color:var(--faint); text-transform:uppercase;}
.spec-sheet-row .v{font-family:'Space Mono'; font-size:18px; font-weight:700;}

footer{border-top:1px solid var(--line); padding:44px 5vw; color:var(--faint); font-size:11.5px; text-align:center; font-family:'Space Mono';}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="brand" onclick="window.location.href='hems_index.html'">
    <div class="ring"></div>
    <span>HEMS</span>
  </div>
  <div class="nav-right">
    <!-- 🌟 新增這行：系統時間顯示 (套用霓虹綠與等寬字體) -->
    <div id="sysTime" style="color: var(--accent); font-family: 'Space Mono', monospace; font-size: 14px; letter-spacing: 1.5px;">TIME: --:--</div>
    
    <div class="crumb">主頁 <span style="opacity:.4">/</span> <b>05 電錶總覽</b></div>
  </div>
</div>

<div id="detail-view" class="detail-page active">
  <section class="detail-hero">
    <div class="detail-hero-inner">
      <div class="detail-icon" id="detailIcon">
        <!-- 直接放入 meter SVG -->
        <svg width="200" height="200" viewBox="0 0 100 100" fill="none">
            <rect x="20" y="15" width="60" height="70" stroke="#c8ff4d" stroke-width="1.5"/>
            <circle cx="50" cy="45" r="16" stroke="#c8ff4d" stroke-width="1.5"/>
            <line x1="50" y1="45" x2="58" y2="34" stroke="#c8ff4d" stroke-width="1.5"/>
            <line x1="35" y1="70" x2="65" y2="70" stroke="#c8ff4d" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="detail-title-block">
        <button class="btn-line" onclick="window.location.href='hems_index.html'"><span class="arrow">←</span> BACK TO HOME</button>
        <div class="spec-label" style="margin-top:26px;">SYSTEM METERS</div>
        <h1 id="detailTitle">電錶總覽 METER</h1>
        <div style="margin-top:20px;"><span class="badge badge-on">ONLINE 錄製中</span></div>
      </div>
    </div>
  </section>

  <div class="section tight">
    <div class="grid-2">
      <!-- 左側：6 顆電錶的當前數值面板 -->
      <div class="card">
        <div class="spec-label" style="margin-bottom:15px; color:var(--accent);">當前累積功率 (CUMULATIVE ENERGY)</div>
        <div class="spec-sheet">
          <div class="spec-sheet-row">
            <span class="k" style="color:#ffffff;">總電錶 T</span>
            <span class="v" id="val-meter-t">-- kWh</span>
          </div>
          <div class="spec-sheet-row">
            <span class="k" style="color:var(--accent);">PV 電錶</span>
            <span class="v" id="val-meter-pv" style="color:var(--accent);">-- kWh</span>
          </div>
          <div class="spec-sheet-row">
            <span class="k" style="color:#4deeea;">A 電錶</span>
            <span class="v" id="val-meter-a">-- kWh</span>
          </div>
          <div class="spec-sheet-row">
            <span class="k" style="color:#b74dff;">B 電錶</span>
            <span class="v" id="val-meter-b">-- kWh</span>
          </div>
          <div class="spec-sheet-row">
            <span class="k" style="color:#ff9e4d;">C 電錶</span>
            <span class="v" id="val-meter-c">-- kWh</span>
          </div>
          <div class="spec-sheet-row">
            <span class="k" style="color:#ffea4d;">D 電錶</span>
            <span class="v" id="val-meter-d">-- kWh</span>
          </div>
        </div>
      </div>
      
      <!-- 右側：歷史曲線圖 -->
      <div class="card">
        <p class="chart-label">CUMULATIVE TREND (kWh)</p>
        <canvas id="metersChart" height="240"></canvas>
      </div>
    </div>
  </div>
</div>

<footer>
  HEMS PROTOTYPE — DATA SOURCED FROM /data/sample/*.csv
</footer>
<script>
/* ============================================================
   資料層：結合 API 驅動引擎與動態 CSV 讀取 (圖表修復版)
   ============================================================ */
let metersChartInstance = null;

async function fetchLiveGridStatus() {
  try {
    // 呼叫 API 推進時間
    const apiRes = await fetch('/api/grid_status');
    const apiData = await apiRes.json();

    if (apiData.status === 'success') {
      
      // 讀取最新的 CSV
      const res = await fetch(`/data/All_meter.csv?t=${Date.now()}`);
      if (!res.ok) throw new Error('伺服器尚未產生檔案');
      
      const text = await res.text();
      const cleanText = text.replace(/^\uFEFF/, '');
      const historyData = Papa.parse(cleanText.trim(), {header: true, dynamicTyping: true, skipEmptyLines: true}).data;

      if (!historyData || historyData.length === 0) return;

      const latest = historyData[historyData.length - 1];
      
      // 動態尋找正確的欄位名稱 (防呆機制)
      const keys = Object.keys(latest);
      const k_time = keys.find(k => k.toLowerCase().includes('time')) || 'Time';
      const k_t = keys.find(k => k.includes('總電錶')) || '總電錶T_當前累積功率(kWh)';
      const k_pv = keys.find(k => k.toLowerCase().includes('pv')) || 'PV電錶_當前累積功率(kWh)';
      const k_a = keys.find(k => k.includes('A電錶')) || 'A電錶_當前累積功率(kWh)';
      const k_b = keys.find(k => k.includes('B電錶')) || 'B電錶_當前累積功率(kWh)';
      const k_c = keys.find(k => k.includes('C電錶')) || 'C電錶_當前累積功率(kWh)';
      const k_d = keys.find(k => k.includes('D電錶')) || 'D電錶_當前累積功率(kWh)';

      // 更新右上角的系統時間
      const timeOnly = apiData.timestamp.replace('模擬時間 ', '').trim();
      document.getElementById('sysTime').textContent = `TIME: ${timeOnly}`;

      // 綁定 DOM 更新左側面板數值 (加上 parseFloat 防止出錯)
      document.getElementById('val-meter-t').textContent = (parseFloat(latest[k_t]) || 0).toFixed(2) + ' kWh';
      document.getElementById('val-meter-pv').textContent = (parseFloat(latest[k_pv]) || 0).toFixed(2) + ' kWh';
      document.getElementById('val-meter-a').textContent = (parseFloat(latest[k_a]) || 0).toFixed(2) + ' kWh';
      document.getElementById('val-meter-b').textContent = (parseFloat(latest[k_b]) || 0).toFixed(2) + ' kWh';
      document.getElementById('val-meter-c').textContent = (parseFloat(latest[k_c]) || 0).toFixed(2) + ' kWh';
      document.getElementById('val-meter-d').textContent = (parseFloat(latest[k_d]) || 0).toFixed(2) + ' kWh';

      const MAX_POINTS = 96;
      const recentData = historyData.slice(-MAX_POINTS);

      // 🌟 修正 3：強制將歷史資料轉為數字型態 (Float)
      const labels = recentData.map(r => r[k_time] || timeOnly);
      const dataT = recentData.map(r => parseFloat(r[k_t]) || 0);
      const dataPV = recentData.map(r => parseFloat(r[k_pv]) || 0);
      const dataA = recentData.map(r => parseFloat(r[k_a]) || 0);
      const dataB = recentData.map(r => parseFloat(r[k_b]) || 0);
      const dataC = recentData.map(r => parseFloat(r[k_c]) || 0);
      const dataD = recentData.map(r => parseFloat(r[k_d]) || 0);

      // 圖表繪製與更新邏輯
      if (!metersChartInstance) {
        const ctx = document.getElementById('metersChart').getContext('2d');
        metersChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              // 🌟 優化 2：把 pointRadius 改回 0 (隱藏點)，並把 tension 調成 0.4 (讓線條帶有滑順的微弧度)
              { label: '總電錶 T', data: dataT, borderColor: '#ffffff', fill: false, tension: 0.4, pointRadius: 0, borderWidth: 2 },
              { label: 'PV 電錶', data: dataPV, borderColor: '#c8ff4d', fill: false, tension: 0.4, pointRadius: 0, borderWidth: 2 },
              { label: 'A 電錶', data: dataA, borderColor: '#4deeea', fill: false, tension: 0.4, pointRadius: 0, borderWidth: 1.5 },
              { label: 'B 電錶', data: dataB, borderColor: '#b74dff', fill: false, tension: 0.4, pointRadius: 0, borderWidth: 1.5 },
              { label: 'C 電錶', data: dataC, borderColor: '#ff9e4d', fill: false, tension: 0.4, pointRadius: 0, borderWidth: 1.5 },
              { label: 'D 電錶', data: dataD, borderColor: '#ffea4d', fill: false, tension: 0.4, pointRadius: 0, borderWidth: 1.5 }
            ]
          },
          
          options: {
            responsive: true,
            // 🌟 修正 1：拿掉 maintainAspectRatio: false，讓畫布的高度不被強制壓縮
            animation: { duration: 0 },
            plugins: {
              legend: { display: true, position: 'top', labels: { color: '#8a8a90', font: { family: 'Space Mono', size: 10 }, usePointStyle: true, boxWidth: 6 } }
            },
            scales: {
              x: { ticks: { color: '#5a5a60', font: { family: 'Space Mono', size: 9 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
              y: { ticks: { color: '#5a5a60', font: { family: 'Space Mono', size: 9 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
            }
          }
        });
      } else {
        metersChartInstance.data.labels = labels;
        metersChartInstance.data.datasets[0].data = dataT;
        metersChartInstance.data.datasets[1].data = dataPV;
        metersChartInstance.data.datasets[2].data = dataA;
        metersChartInstance.data.datasets[3].data = dataB;
        metersChartInstance.data.datasets[4].data = dataC;
        metersChartInstance.data.datasets[5].data = dataD;
        metersChartInstance.update();
      }
    }
  } catch (e) {
    console.log("等待資料中，若持續出錯請檢查 F12 的 Network...", e);
  }
}

// 導覽列滾動特效
window.addEventListener('scroll', ()=>{
  document.getElementById('topbar').classList.toggle('scrolled', window.scrollY > 40);
});

// 啟動定時器
setInterval(fetchLiveGridStatus, 1000);
fetchLiveGridStatus(); 
</script>
</body>
</html>
